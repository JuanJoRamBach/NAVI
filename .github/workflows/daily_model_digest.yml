name: Daily model digest

on:
  schedule:
    # 08:00 UTC = 10:00 Spain time during CEST (summer, UTC+2). Cron is
    # fixed UTC with no DST awareness, so this will read as 09:00 Spain
    # time once winter CET (UTC+1) kicks in — adjust then if it matters.
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python jobs/daily_model_digest.py
