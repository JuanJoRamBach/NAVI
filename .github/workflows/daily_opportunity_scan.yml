name: Daily opportunity scan

on:
  schedule:
    # 08:15 UTC = 10:15 Spain time during CEST (summer, UTC+2) — a few
    # minutes after the model digest. Same DST caveat as that workflow:
    # will read as 09:15 Spain time once winter CET kicks in.
    - cron: "15 8 * * *"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run opportunity scan
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python jobs/daily_opportunity_scan.py
